name: Actualizar seguidores

on:
  schedule:
    - cron: "23 13 * * *"   # todos los días, 9:23 a. m. hora Venezuela
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer seguidores de Instagram y TikTok
        run: python scripts/seguidores.py
      - name: Guardar cambios
        run: |
          if git diff --quiet seguidores.json; then
            echo "Sin cambios"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add seguidores.json
            git commit -m "Actualizar seguidores"
            git push
          fi
